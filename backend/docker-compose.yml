services:
  db:
    image: postgres:16-alpine
    container_name: procureflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: procureflow
      POSTGRES_PASSWORD: procureflow
      POSTGRES_DB: procureflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureflow"]
      interval: 10s
      retries: 5

volumes:
  pgdata:

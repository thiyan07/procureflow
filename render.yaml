databases:
  - name: procureflow-db
    plan: free
    databaseName: procureflow
    user: procureflow

services:
  - type: web
    name: procureflow-api
    env: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head || echo "alembic failed, continuing" && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: procureflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://procureflow.app,http://localhost:3000
      - key: PYTHONPATH
        value: .
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false
